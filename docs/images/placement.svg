<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
<title id="title">Automatic placement and persistent Free fallback</title>
<desc id="desc">Schematic, not a GUI screenshot. Search safe titlebar space; otherwise use the default frame; if a button overlaps the default, save Free mode and allow dragging.</desc>
<rect width="1200" height="310" rx="24" fill="#f4f6f9"/>
<g font-family="Helvetica Neue,Arial,sans-serif" fill="#182539">
<text x="36" y="43" font-size="22" font-weight="700">Current macOS placement · 0.4.0 candidate</text>
<text x="36" y="69" font-size="14" fill="#526177">Behavior schematic — not a GUI screenshot</text>
<g transform="translate(36 95)"><rect width="348" height="150" rx="16" fill="white" stroke="#ccd4df"/>
<text x="20" y="35" font-size="18" font-weight="700">1 · Find free space</text><text x="20" y="67" font-size="15">Measured indicator width + 8 pt gaps</text><text x="20" y="96" font-size="15">Avoid real controls and title text</text><text x="20" y="127" font-size="14" fill="#176442">Space fits → stay Automatic</text></g>
<text x="398" y="178" font-size="24">→</text>
<g transform="translate(426 95)"><rect width="348" height="150" rx="16" fill="white" stroke="#ccd4df"/>
<text x="20" y="35" font-size="18" font-weight="700">2 · Default position</text><text x="20" y="67" font-size="15">No safe slot → use the default frame</text><text x="20" y="96" font-size="15">The default is not reserved space</text><text x="20" y="127" font-size="14" fill="#176442">No button collision → stay Automatic</text></g>
<text x="788" y="178" font-size="24">→</text>
<g transform="translate(816 95)"><rect width="348" height="150" rx="16" fill="#eaf2ff" stroke="#a8c6f5"/>
<text x="20" y="35" font-size="18" font-weight="700">3 · Switch to Free</text><text x="20" y="67" font-size="15">Default collides with a button</text><text x="20" y="96" font-size="15">Save mode + default position</text><text x="20" y="127" font-size="14" fill="#245a9c">Keep visible; drag to reposition</text></g>
<text x="36" y="283" font-size="15" fill="#526177">Return to Automatic explicitly. Locked position and detail-card lock are separate controls.</text>
</g></svg>