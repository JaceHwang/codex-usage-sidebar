      <rect y="28" width="110" height="300" rx="16" fill="#e8eaee"/><path d="M110 28v300" stroke="#d5d8df"/>
      <g fill="#777e8d" font-size="12"><text x="20" y="84">General</text><text x="20" y="116">Appearance</text><text x="20" y="148">Accounts</text><text x="20" y="180">Git</text></g>
      <circle cx="232" cy="150" r="36" fill="#eef8f5"/><path d="M217 150l10 10 21-23" fill="none" stroke="#31b487" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="164" y="216" fill="#303540" font-size="15" font-weight="650">Overlay hidden</text>
      <text x="140" y="244" fill="#737b8b" font-size="12">No orphan footer button</text>
