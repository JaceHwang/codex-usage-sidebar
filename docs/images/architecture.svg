<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Codex Usage Sidebar local architecture</title>
  <desc id="desc">An isolated quota stream and collision-aware titlebar geometry feed an external native overlay.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#899286"/>
    </marker>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111610"/><stop offset="1" stop-color="#20251d"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="430" rx="28" fill="url(#background)"/>
  <g font-family="Avenir Next,Helvetica Neue,sans-serif">
    <text x="48" y="56" fill="#f2f4e9" font-size="26" font-weight="700">Local data. Semantic placement. External companion.</text>

    <g transform="translate(48 102)">
      <rect width="230" height="245" rx="18" fill="#20291f" stroke="#465243"/>
      <text x="22" y="37" fill="#edf2e8" font-size="17" font-weight="700">Official Codex</text>
      <rect x="22" y="62" width="186" height="58" rx="11" fill="#2b3529"/>
      <text x="38" y="87" fill="#c2cabd" font-size="13">app-server over stdio</text>
      <text x="38" y="106" fill="#82907d" font-size="11">quota + Bank updates</text>
      <rect x="22" y="137" width="186" height="58" rx="11" fill="#2b3529"/>
      <text x="38" y="162" fill="#c2cabd" font-size="13">Accessibility tree</text>
      <text x="38" y="181" fill="#82907d" font-size="11">titlebar labels + frames</text>
      <text x="22" y="224" fill="#768172" font-size="11">Application bundle remains read-only</text>
    </g>

    <path d="M278 172h116" stroke="#899286" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M278 274h116" stroke="#899286" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(394 102)">
      <rect width="306" height="245" rx="18" fill="#253025" stroke="#61705d"/>
      <text x="22" y="37" fill="#f1f4eb" font-size="17" font-weight="700">Native AppKit companion</text>
      <g fill="#c3cdc0" font-size="13">
        <text x="22" y="76">AllowanceSnapshot + every Bank entry</text>
        <text x="22" y="108">Isolated CodexHome credentials</text>
        <text x="22" y="140">Semantic anchor + collision resolver</text>
        <text x="22" y="172">Titlebar geometry every 0.1 seconds</text>
        <text x="22" y="204">Theme + continuous quota color</text>
      </g>
      <text x="22" y="228" fill="#82907d" font-size="11">User LaunchAgent - no global input monitor</text>
    </g>

    <path d="M700 224h112" stroke="#899286" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(812 137)">
      <rect width="238" height="175" rx="18" fill="#282c25" stroke="#777e70"/>
      <text x="22" y="34" fill="#e9ece3" font-size="14" font-weight="700">Non-activating overlay</text>
      <rect x="22" y="55" width="120" height="34" rx="9" fill="#383d34"/>
      <text x="38" y="77" fill="#66c68e" font-size="13" font-weight="700">57% | 16:08</text>
      <path d="M151 58v28" stroke="#d3a349" stroke-width="2"/>
      <text x="163" y="76" fill="#d3a349" font-size="11">safe</text>
      <text x="22" y="121" fill="#bdc4b8" font-size="12">direct anchor, nearest slot,</text>
      <text x="22" y="141" fill="#bdc4b8" font-size="12">or reserved right fallback</text>
    </g>
  </g>
</svg>
