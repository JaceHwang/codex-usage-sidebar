<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Codex Usage Sidebar overview</title>
  <desc id="desc">A privacy-safe illustration of the permanent right titlebar quota and its hover details with the sidebar expanded or collapsed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#171b2f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#33d6a6"/><stop offset="1" stop-color="#5aa7ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1200" height="620" rx="32" fill="url(#bg)"/>
  <circle cx="1060" cy="88" r="180" fill="#2667ff" opacity=".10"/>
  <circle cx="150" cy="530" r="200" fill="#1dd3a7" opacity=".08"/>
  <text x="72" y="78" fill="#f5f7ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="700">Usage at a glance. Details on hover.</text>
  <text x="72" y="112" fill="#9aa4bd" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18">Native macOS companion · local Codex data · theme aware</text>

  <g transform="translate(70 150)" filter="url(#shadow)">
    <rect width="680" height="400" rx="20" fill="#f7f7f8"/>
    <rect width="210" height="400" rx="20" fill="#ececee"/>
    <path d="M210 0v400" stroke="#d5d5d8"/>
    <circle cx="28" cy="24" r="7" fill="#ff5f57"/><circle cx="50" cy="24" r="7" fill="#febc2e"/><circle cx="72" cy="24" r="7" fill="#28c840"/>
    <rect x="500" y="7" width="110" height="32" rx="9" fill="#e5e6e9"/>
    <text x="514" y="28" fill="#2d2d32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="650">57% · 16:08</text>
    <g fill="none" stroke="#737987" stroke-width="1.5"><circle cx="630" cy="23" r="9"/><path d="M656 14v18M647 23h18"/></g>
    <text x="22" y="72" fill="#2d2d32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="650">Codex</text>
    <g fill="#6e6e76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">
      <text x="22" y="112">New task</text><text x="22" y="146">Pull requests</text><text x="22" y="180">Plugins</text>
    </g>
    <rect x="0" y="350" width="210" height="50" fill="#e7e7e9"/>
    <circle cx="24" cy="375" r="11" fill="#737987"/>
    <text x="43" y="380" fill="#34343a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">Profile</text>
    <circle cx="195" cy="375" r="11" fill="none" stroke="#737987" stroke-width="1.5"/><text x="191.5" y="380" fill="#737987" font-family="sans-serif" font-size="13">?</text>

    <text x="250" y="88" fill="#2d2d32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="700">Always in the right titlebar</text>
    <text x="250" y="120" fill="#737987" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Expanded or collapsed, the position stays the same.</text>
    <g transform="translate(410 144)">
      <rect width="224" height="226" rx="14" fill="#f3f3f4" stroke="#d7d7da"/>
      <text x="18" y="32" fill="#303036" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="700">Codex usage</text>
      <text x="188" y="32" fill="#303036" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700">57%</text>
      <rect x="18" y="48" width="188" height="5" rx="2.5" fill="#d5d7db"/><rect x="18" y="48" width="107" height="5" rx="2.5" fill="url(#accent)"/>
      <g fill="#747780" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12"><text x="18" y="84">PLAN</text><text x="18" y="112">RESET</text><text x="18" y="140">CREDITS</text><text x="18" y="168">BANK</text><text x="18" y="196">BANK 1</text></g>
      <g fill="#303036" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12"><text x="206" y="84">Plus</text><text x="206" y="112">Aug 8 · 16:08</text><text x="206" y="140">None</text><text x="206" y="168">1 available</text><text x="206" y="196">Expires Aug 13</text></g>
    </g>
  </g>

  <g transform="translate(800 184)" filter="url(#shadow)">
    <rect width="330" height="235" rx="20" fill="#222737" stroke="#3c4358"/>
    <circle cx="25" cy="22" r="6" fill="#ff5f57"/><circle cx="45" cy="22" r="6" fill="#febc2e"/><circle cx="65" cy="22" r="6" fill="#28c840"/>
    <rect x="0" y="44" width="330" height="1" fill="#3c4358"/>
    <rect x="150" y="6" width="118" height="32" rx="9" fill="#30364a"/>
    <text x="166" y="27" fill="#f4f6fb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="650">57% · 16:08</text>
    <g fill="none" stroke="#939bb0" stroke-width="2"><circle cx="285" cy="22" r="8"/><path d="M309 14v16M301 22h16"/></g>
    <text x="28" y="94" fill="#f4f6fb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" font-weight="700">Collapsed sidebar · same place</text>
    <text x="28" y="124" fill="#aab2c7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">Quota remains beside the native</text>
    <text x="28" y="146" fill="#aab2c7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">right-side controls with an 8 pt gap.</text>
    <rect x="28" y="174" width="274" height="7" rx="3.5" fill="#343a4d"/><rect x="28" y="174" width="156" height="7" rx="3.5" fill="url(#accent)"/>
    <text x="28" y="207" fill="#737f9b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">LIVE FROM LOCAL CODEX APP-SERVER</text>
  </g>
</svg>
