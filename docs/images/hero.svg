<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Codex Usage Sidebar adaptive quota control</title>
  <desc id="desc">A Codex window with a collision-aware quota control and a detailed Bank hover card.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10140f"/>
      <stop offset=".55" stop-color="#172019"/>
      <stop offset="1" stop-color="#23251d"/>
    </linearGradient>
    <linearGradient id="quota" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#df5b3f"/>
      <stop offset=".45" stop-color="#e6a438"/>
      <stop offset="1" stop-color="#3fac73"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="32" fill="url(#background)"/>
  <path d="M0 500C210 415 322 630 565 541S978 425 1200 516V620H0Z" fill="#d9e8a5" opacity=".06"/>
  <circle cx="1080" cy="58" r="210" fill="#efb34f" opacity=".06"/>
  <g font-family="Avenir Next,Helvetica Neue,sans-serif">
    <text x="70" y="72" fill="#f4f4e9" font-size="35" font-weight="700">Quota that stays attached to Codex.</text>
    <text x="70" y="108" fill="#aeb5a5" font-size="18">One control. Adaptive safe placement. Live Bank details on hover.</text>

    <g transform="translate(68 150)" filter="url(#shadow)">
      <rect width="1064" height="402" rx="22" fill="#f7f6f1"/>
      <rect width="1064" height="54" rx="22" fill="#ecebe6"/>
      <path d="M0 54h1064" stroke="#d6d5cf"/>
      <circle cx="27" cy="27" r="7" fill="#ff5f57"/>
      <circle cx="49" cy="27" r="7" fill="#febc2e"/>
      <circle cx="71" cy="27" r="7" fill="#28c840"/>
      <rect y="54" width="210" height="348" fill="#e8e7e2"/>
      <path d="M210 54v348" stroke="#d2d1cb"/>

      <g transform="translate(662 10)">
        <rect width="132" height="34" rx="9" fill="#e1e0db"/>
        <text x="16" y="23" fill="#285f45" font-size="14" font-weight="700">57%  |  16:08</text>
        <path d="M140 5v24" stroke="#bf8b2d" stroke-width="2"/>
        <path d="M136 5h8M136 29h8" stroke="#bf8b2d" stroke-width="2"/>
        <text x="150" y="21" fill="#9a722b" font-size="11" font-weight="700">8 pt</text>
        <rect x="186" width="124" height="34" rx="9" fill="#deddd8"/>
        <path d="M204 10h14v14h-14zM207 7h14v14" fill="none" stroke="#676b62" stroke-width="1.5"/>
        <text x="227" y="22" fill="#383b35" font-size="13" font-weight="600">Open Location</text>
      </g>

      <g fill="#3d4039" font-size="14">
        <text x="24" y="94" font-size="17" font-weight="700">Codex</text>
        <text x="24" y="132">New task</text>
        <text x="24" y="166">Pull requests</text>
        <text x="24" y="200">Plugins</text>
      </g>

      <text x="252" y="116" fill="#252822" font-size="23" font-weight="700">Open any pane. Resize anything.</text>
      <text x="252" y="148" fill="#777b70" font-size="15">Direct anchor, nearest free slot, or reserved fallback.</text>

      <g transform="translate(596 82)">
        <rect width="386" height="282" rx="16" fill="#fff" stroke="#d2d1cb"/>
        <text x="22" y="35" fill="#292c26" font-size="16" font-weight="700">Codex usage</text>
        <text x="346" y="35" fill="#318157" font-size="20" font-weight="700" text-anchor="end">57%</text>
        <rect x="22" y="52" width="342" height="7" rx="3.5" fill="#e2e2dc"/>
        <rect x="22" y="52" width="195" height="7" rx="3.5" fill="url(#quota)"/>
        <g fill="#898d82" font-size="11" font-weight="700">
          <text x="22" y="92">PLAN</text><text x="22" y="123">RESET</text>
          <text x="22" y="154">CREDITS</text><text x="22" y="185">BANK</text>
          <text x="22" y="216">BANK 1</text><text x="22" y="247">BANK 2</text>
        </g>
        <g fill="#373a33" font-size="13" text-anchor="end">
          <text x="364" y="92">Plus</text><text x="364" y="123">Aug 9, 16:08</text>
          <text x="364" y="154">None</text><text x="364" y="185">2 available</text>
          <text x="364" y="216">Available - expires Aug 13</text>
          <text x="364" y="247">Available - expires Aug 20</text>
        </g>
      </g>
    </g>
  </g>
</svg>
