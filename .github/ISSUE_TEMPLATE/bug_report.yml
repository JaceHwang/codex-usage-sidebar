name: Bug report
description: Report a reproducible problem with installation, data, or placement.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Before filing, read docs/TROUBLESHOOTING.md and remove private data from logs or images.
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS version, Mac model/architecture, and Codex build.
    validations:
      required: true
  - type: dropdown
    id: accessibility
    attributes:
      label: Accessibility state
      options: [granted, required, unknown]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Describe the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Sanitized status output
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, personal paths, conversations, and unrelated desktop content.
          required: true
