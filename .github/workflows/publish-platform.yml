name: Publish release platform

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v1.2.3
        required: true
        type: string
      platform:
        description: Platform key declared by RELEASE_PLATFORMS
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: release / publish platform
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_PLATFORM: ${{ inputs.platform }}
    steps:
      - name: Validate release inputs
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
      - name: Check out exact release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
      - name: Build and verify platform assets
        run: |
          set -euo pipefail
          . .governance/policy.defaults.sh
          test -f .governance/policy.sh && . .governance/policy.sh
          case " $RELEASE_PLATFORMS " in
            *" $RELEASE_PLATFORM "*) ;;
            *) echo "unknown platform: $RELEASE_PLATFORM" >&2; exit 64 ;;
          esac
          test "$RELEASE_MODE" = staged
          chmod +x governance "$BUILD_RELEASE_ADAPTER" "$VERIFY_RELEASE_ADAPTER"
          "$BUILD_RELEASE_ADAPTER" "$RELEASE_PLATFORM" "$RELEASE_TAG"
          "$VERIFY_RELEASE_ADAPTER" "$RELEASE_PLATFORM" "$RELEASE_TAG"
          asset_dir=".dist/release/$RELEASE_PLATFORM"
          compgen -G "$asset_dir/*" >/dev/null
          existing="$RUNNER_TEMP/existing-assets"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' >"$existing"
          for asset in "$asset_dir"/*; do
            name=$(basename "$asset")
            ! grep -Fqx "$name" "$existing" || { echo "asset already exists: $name" >&2; exit 1; }
          done
          gh release upload "$RELEASE_TAG" "$asset_dir"/* --repo "$GITHUB_REPOSITORY"
      - name: Update platform status and publish draft
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/release-body.md"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body >"$body"
          ./governance release status "$body" "$RELEASE_PLATFORM" available
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$body" --draft=false

