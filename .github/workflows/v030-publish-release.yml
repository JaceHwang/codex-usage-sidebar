name: Publish v0.3.0 Release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful v0.3.0 release-candidates run ID
        required: true
        type: string
      release_target:
        description: Commit SHA for the public v0.3.0 tag/release
        required: true
        type: string
      packaging_commit:
        description: Commit SHA that produced the release bundle
        required: true
        type: string
      validated_source:
        description: Validated source commit embedded in provenance
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Verify bundle and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: v0.3.0
      RELEASE_TITLE: Codex Usage Sidebar v0.3.0
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      RELEASE_TARGET: ${{ inputs.release_target }}
      PACKAGING_COMMIT: ${{ inputs.packaging_commit }}
      VALIDATED_SOURCE: ${{ inputs.validated_source }}
      RELEASE_BUNDLE: codex-usage-sidebar-v0.3.0-release-bundle
    steps:
      - name: Validate inputs and candidate run
        run: |
          set -euo pipefail
          sha='^[0-9a-f]{40}$'
          [[ "$RELEASE_TARGET" =~ $sha ]] || { echo "invalid release_target" >&2; exit 64; }
          [[ "$PACKAGING_COMMIT" =~ $sha ]] || { echo "invalid packaging_commit" >&2; exit 64; }
          [[ "$VALIDATED_SOURCE" =~ $sha ]] || { echo "invalid validated_source" >&2; exit 64; }
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "invalid candidate_run_id" >&2; exit 64; }

          run="$(gh api "repos/$REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          test "$(jq -r '.name' <<<"$run")" = "v0.3.0 release candidates"
          test "$(jq -r '.event' <<<"$run")" = push
          test "$(jq -r '.head_branch' <<<"$run")" = v0.3.0
          test "$(jq -r '.head_repository.full_name' <<<"$run")" = "$REPOSITORY"
          test "$(jq -r '.status' <<<"$run")" = completed
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$(jq -r '.head_sha' <<<"$run")" = "$PACKAGING_COMMIT"
          case "$(jq -r '.path' <<<"$run")" in
            ".github/workflows/v030-release-candidates.yml") ;;
            ".github/workflows/v030-release-candidates.yml@"*) ;;
            *) echo "candidate run used an unexpected workflow path" >&2; exit 1 ;;
          esac

          artifacts="$(gh api "repos/$REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100")"
          count="$(jq --arg name "$RELEASE_BUNDLE" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"$artifacts")"
          test "$count" = 1

      - name: Check out release target
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_target }}
          fetch-depth: 0

      - name: Download and verify release bundle
        id: bundle
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/release-bundle"
          mkdir -p "$bundle"
          gh run download "$CANDIDATE_RUN_ID" \
            --repo "$REPOSITORY" \
            --name "$RELEASE_BUNDLE" \
            --dir "$bundle"

          required=(
            codex-usage-sidebar-v0.3.0-windows-x64-setup.exe
            WINDOWS-V030-SHA256SUMS.txt
            WINDOWS-V030-PROVENANCE.final.json
            codex-usage-sidebar-v0.3.0-macos-arm64.dmg
            MACOS-V030-SHA256SUMS.txt
            MACOS-V030-PROVENANCE.final.json
          )
          for asset in "${required[@]}"; do
            test -f "$bundle/$asset"
          done

          python3 scripts/verify-v030-candidate-set.py "$bundle" \
            --validated-source "$VALIDATED_SOURCE" \
            --packaging-commit "$PACKAGING_COMMIT" \
            --release-profile quick-prerelease \
            --output "$RUNNER_TEMP/V030-RELEASE-SUMMARY.json"
          printf 'path=%s\n' "$bundle" >>"$GITHUB_OUTPUT"

      - name: Inspect release state and remove stale drafts
        id: release_state
        run: |
          set -euo pipefail
          releases="$(gh api "repos/$REPOSITORY/releases" --paginate)"
          public_id="$(jq -r --arg tag "$RELEASE_TAG" '
            [.[] | select(.tag_name == $tag and .draft == false)] |
            if length == 0 then "" elif length == 1 then .[0].id else error("multiple public releases") end
          ' <<<"$releases")"
          if [[ -n "$public_id" ]]; then
            printf 'mode=verify-existing\n' >>"$GITHUB_OUTPUT"
            printf 'public_id=%s\n' "$public_id" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag and .draft == true) | .id' <<<"$releases" |
            while read -r release_id; do
              [[ -n "$release_id" ]] || continue
              gh api -X DELETE "repos/$REPOSITORY/releases/$release_id"
            done
          printf 'mode=create\n' >>"$GITHUB_OUTPUT"

      - name: Create draft release with exact assets
        if: steps.release_state.outputs.mode == 'create'
        id: draft
        env:
          BUNDLE: ${{ steps.bundle.outputs.path }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$BUNDLE/codex-usage-sidebar-v0.3.0-windows-x64-setup.exe" \
            "$BUNDLE/WINDOWS-V030-SHA256SUMS.txt" \
            "$BUNDLE/WINDOWS-V030-PROVENANCE.final.json" \
            "$BUNDLE/codex-usage-sidebar-v0.3.0-macos-arm64.dmg" \
            "$BUNDLE/MACOS-V030-SHA256SUMS.txt" \
            "$BUNDLE/MACOS-V030-PROVENANCE.final.json" \
            --repo "$REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title "$RELEASE_TITLE" \
            --notes-file docs/releases/v0.3.0.md \
            --draft \
            --latest

          releases="$(gh api "repos/$REPOSITORY/releases" --paginate)"
          release_id="$(jq -r --arg tag "$RELEASE_TAG" '
            [.[] | select(.tag_name == $tag and .draft == true)] |
            sort_by(.created_at) | last | .id
          ' <<<"$releases")"
          [[ "$release_id" =~ ^[0-9]+$ ]] || { echo "draft release not found" >&2; exit 1; }
          printf 'id=%s\n' "$release_id" >>"$GITHUB_OUTPUT"

      - name: Verify draft assets
        if: steps.release_state.outputs.mode == 'create'
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/$REPOSITORY/releases/$RELEASE_ID")"
          test "$(jq -r '.draft' <<<"$release")" = true
          test "$(jq -r '.prerelease' <<<"$release")" = false
          test "$(jq -r '.tag_name' <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r '.target_commitish' <<<"$release")" = "$RELEASE_TARGET"
          jq -e '
            [.assets[].name] | sort == [
              "MACOS-V030-PROVENANCE.final.json",
              "MACOS-V030-SHA256SUMS.txt",
              "WINDOWS-V030-PROVENANCE.final.json",
              "WINDOWS-V030-SHA256SUMS.txt",
              "codex-usage-sidebar-v0.3.0-macos-arm64.dmg",
              "codex-usage-sidebar-v0.3.0-windows-x64-setup.exe"
            ]
          ' <<<"$release"

      - name: Publish release
        if: steps.release_state.outputs.mode == 'create'
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true >/dev/null

      - name: Verify public release by downloading assets
        run: |
          set -euo pipefail
          release="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish,assets,url)"
          test "$(jq -r '.tagName' <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r '.isDraft' <<<"$release")" = false
          test "$(jq -r '.isPrerelease' <<<"$release")" = false
          test "$(jq -r '.targetCommitish' <<<"$release")" = "$RELEASE_TARGET"
          test "$(jq '.assets | length' <<<"$release")" = 6

          public="$RUNNER_TEMP/public-release"
          mkdir -p "$public"
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --dir "$public"
          python3 scripts/verify-v030-candidate-set.py "$public" \
            --validated-source "$VALIDATED_SOURCE" \
            --packaging-commit "$PACKAGING_COMMIT" \
            --release-profile quick-prerelease \
            --output "$RUNNER_TEMP/V030-PUBLIC-RELEASE-SUMMARY.json"
