name: Windows v0.3.1 parity build

on:
  push:
    branches:
      - main
      - "codex/**"
      - "release/**"
    tags:
      - "macos-v*"
      - "windows-v*"
      - "v*"
    paths:
      - ".github/workflows/windows-v031.yml"
      - "plugins/codex-usage-sidebar/contracts/**"
      - "plugins/codex-usage-sidebar/windows/**"
      - "plugins/codex-usage-sidebar/assets/quota-icon-*.png"
      - "docs/WINDOWS-V031-PARITY.md"
      - "releases/**"
      - "VERSIONING.md"
      - "docs/RELEASES.md"
      - "scripts/validate-platform-release.py"
      - "tests/test-release-governance.py"
  pull_request:
    paths:
      - ".github/workflows/windows-v031.yml"
      - "plugins/codex-usage-sidebar/contracts/**"
      - "plugins/codex-usage-sidebar/windows/**"
      - "plugins/codex-usage-sidebar/assets/quota-icon-*.png"
      - "docs/WINDOWS-V031-PARITY.md"
      - "releases/**"
      - "VERSIONING.md"
      - "docs/RELEASES.md"
      - "scripts/validate-platform-release.py"
      - "tests/test-release-governance.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-build:
    name: Windows x64 compile and tests
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Validate Windows release governance
        shell: pwsh
        run: python scripts/validate-platform-release.py --catalog releases/platform-release-catalog.json --target windows

      - name: Restore Windows solution
        shell: pwsh
        run: dotnet restore plugins/codex-usage-sidebar/windows/CodexUsageSidebar.Windows.sln --nologo

      - name: Run portable Core tests
        shell: pwsh
        run: dotnet test plugins/codex-usage-sidebar/windows/tests/CodexUsageSidebar.Core.Tests/CodexUsageSidebar.Core.Tests.csproj --configuration Release --no-restore --nologo

      - name: Run Windows boundary tests
        shell: pwsh
        run: dotnet test plugins/codex-usage-sidebar/windows/tests/CodexUsageSidebar.Windows.Tests/CodexUsageSidebar.Windows.Tests.csproj --configuration Release --no-restore --nologo

      - name: Build native Windows target
        shell: pwsh
        run: dotnet build plugins/codex-usage-sidebar/windows/src/CodexUsageSidebar.Windows/CodexUsageSidebar.Windows.csproj --configuration Release --framework net8.0-windows10.0.19041.0 --no-restore --nologo

      - name: Publish parity diagnostic payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $PWD '.dist/windows-v031-parity'
          dotnet publish plugins/codex-usage-sidebar/windows/src/CodexUsageSidebar.Control/CodexUsageSidebar.Control.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=false `
            -p:InstallerDisplayVersion=0.3.1 --output $output --nologo
          if (-not (Test-Path (Join-Path $output 'CodexUsageSidebar.Control.exe'))) {
            throw 'Missing CodexUsageSidebar.Control.exe'
          }
          @'
          This is a v0.3.1 parity diagnostic payload, not the final installer.
          The final setup requires the Windows 11 x64 real-device gate.
          '@ | Set-Content -LiteralPath (Join-Path $output 'README.txt') -Encoding utf8

      - name: Upload parity payload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codex-usage-sidebar-v0.3.1-windows-x64-parity
          path: .dist/windows-v031-parity
          if-no-files-found: error
