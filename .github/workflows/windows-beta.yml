name: Windows beta diagnostic candidate

on:
  push:
    branches:
      - codex/v0.3.0-beta.1
    paths:
      - ".github/workflows/windows-beta.yml"
      - "plugins/codex-usage-sidebar/contracts/**"
      - "plugins/codex-usage-sidebar/windows/**"
      - "scripts/*windows*"
      - "tests/*windows*"
  pull_request:
    paths:
      - ".github/workflows/windows-beta.yml"
      - "plugins/codex-usage-sidebar/contracts/**"
      - "plugins/codex-usage-sidebar/windows/**"
      - "scripts/*windows*"
      - "tests/*windows*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-candidate:
    name: Windows x64 compile, test, and diagnostic bundle
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Test portable and Windows boundaries
        shell: pwsh
        run: dotnet test plugins/codex-usage-sidebar/windows/CodexUsageSidebar.Windows.sln --configuration Release --nologo

      - name: Cross-check native Windows target
        shell: pwsh
        run: dotnet build plugins/codex-usage-sidebar/windows/src/CodexUsageSidebar.Windows/CodexUsageSidebar.Windows.csproj --configuration Release --framework net8.0-windows10.0.19041.0 --no-restore --nologo

      - name: Build self-contained diagnostic probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $PWD '.dist/windows-diagnostic'
          dotnet publish plugins/codex-usage-sidebar/windows/src/CodexUsageSidebar.Control/CodexUsageSidebar.Control.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=false --output $output --nologo
          if (-not (Test-Path (Join-Path $output 'CodexUsageSidebar.Control.exe'))) {
            throw 'Missing CodexUsageSidebar.Control.exe'
          }

      - name: Package diagnostic candidate with provenance
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD '.dist'
          $bundle = Join-Path $dist 'windows-diagnostic'
          $archiveName = 'codex-usage-sidebar-v0.3.0-beta.1-windows-x64-diagnostic.zip'
          $archive = Join-Path $dist $archiveName
          @'
          This is a diagnostic candidate, not an installer or release.
          Open a signed-in Codex window, then run:
          CodexUsageSidebar.Control.exe probe C:\Temp\codex-usage-sidebar-probe.json
          Add --include-text only when you intentionally want UI Automation names in the report.
          '@ | Set-Content -LiteralPath (Join-Path $bundle 'README.txt') -Encoding utf8
          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath $archive -CompressionLevel Optimal
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $archiveName" | Set-Content -LiteralPath (Join-Path $dist 'WINDOWS-BETA-SHA256SUMS.txt') -Encoding ascii
          [ordered]@{
            schemaVersion = 1
            status = 'diagnostic-candidate'
            version = '0.3.0-beta.1'
            architecture = 'x64'
            sourceCommit = $env:SOURCE_COMMIT
            workflowRun = $env:WORKFLOW_RUN
            archive = [ordered]@{ name = $archiveName; sha256 = $digest }
            realDeviceValidated = $false
            publishableInstaller = $false
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $dist 'WINDOWS-BETA-PROVENANCE.json') -Encoding utf8

      - name: Verify diagnostic checksum
        shell: pwsh
        run: |
          $dist = Join-Path $PWD '.dist'
          $line = Get-Content -LiteralPath (Join-Path $dist 'WINDOWS-BETA-SHA256SUMS.txt')
          $expected, $name = $line -split '  ', 2
          $actual = (Get-FileHash -LiteralPath (Join-Path $dist $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Windows diagnostic checksum mismatch' }

      - name: Upload tested diagnostic candidate
        id: upload_windows_diagnostic
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codex-usage-sidebar-v0.3.0-beta.1-windows-x64-diagnostic
          path: |
            .dist/codex-usage-sidebar-v0.3.0-beta.1-windows-x64-diagnostic.zip
            .dist/WINDOWS-BETA-SHA256SUMS.txt
            .dist/WINDOWS-BETA-PROVENANCE.json
          if-no-files-found: error

      - name: Verify artifact identity is available
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ steps.upload_windows_diagnostic.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_windows_diagnostic.outputs.artifact-digest }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ARTIFACT_ID)) { throw 'Missing artifact ID' }
          if ($env:ARTIFACT_DIGEST -notmatch '^[0-9a-f]{64}$') { throw 'Invalid artifact digest' }
