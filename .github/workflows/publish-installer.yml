name: Publish v0.2.3 macOS Installer

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run ID that produced the installer artifact
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Upload exact tested installer asset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      RELEASE_TAG: v0.2.3
      INSTALLER_ASSET: codex-usage-sidebar-v0.2.3-macos-arm64.dmg
      INSTALLER_ARTIFACT: codex-usage-sidebar-installer-v0.2.3
    steps:
      - name: Verify the target release and CI run
        id: trusted_ci
        run: |
          set -euo pipefail
          release="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json tagName,isDraft,isPrerelease)"
          test "$(jq -r '.tagName' <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r '.isDraft' <<<"$release")" = false
          test "$(jq -r '.isPrerelease' <<<"$release")" = false

          run="$(gh api "repos/$REPOSITORY/actions/runs/$CI_RUN_ID")"
          test "$(jq -r '.name' <<<"$run")" = "CI"
          test "$(jq -r '.event' <<<"$run")" = push
          test "$(jq -r '.head_branch' <<<"$run")" = main
          test "$(jq -r '.head_repository.full_name' <<<"$run")" = "$REPOSITORY"
          test "$(jq -r '.status' <<<"$run")" = completed
          test "$(jq -r '.conclusion' <<<"$run")" = success
          ci_workflow="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml")"
          test "$(jq -r '.workflow_id' <<<"$run")" = "$(jq -r '.id' <<<"$ci_workflow")"
          case "$(jq -r '.path' <<<"$run")" in
            ".github/workflows/ci.yml") ;;
            ".github/workflows/ci.yml@"*) ;;
            *)
              echo "CI run does not use .github/workflows/ci.yml" >&2
              exit 1
              ;;
          esac
          artifacts="$(gh api "repos/$REPOSITORY/actions/runs/$CI_RUN_ID/artifacts?per_page=100")"
          artifact="$(
            jq -cer --arg name "$INSTALLER_ARTIFACT" '
              [.artifacts[] | select(.name == $name and .expired == false)] |
              if length == 1 then .[0] else error("expected exactly one installer artifact") end
            ' <<<"$artifacts"
          )"
          artifact_id="$(jq -r '.id' <<<"$artifact")"
          artifact_digest="$(jq -r '.digest' <<<"$artifact")"
          test "$artifact_id" -gt 0
          case "$artifact_digest" in sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "installer artifact digest is invalid" >&2; exit 1 ;;
          esac

          printf 'head_sha=%s\n' "$(jq -r '.head_sha' <<<"$run")" >>"$GITHUB_OUTPUT"
          printf 'run_repository=%s\n' "$(jq -r '.head_repository.full_name' <<<"$run")" >>"$GITHUB_OUTPUT"
          printf 'run_url=%s\n' "$(jq -r '.html_url' <<<"$run")" >>"$GITHUB_OUTPUT"
          printf 'workflow_path=%s\n' "$(jq -r '.path' <<<"$run")" >>"$GITHUB_OUTPUT"
          printf 'event=%s\n' "$(jq -r '.event' <<<"$run")" >>"$GITHUB_OUTPUT"
          printf 'branch=%s\n' "$(jq -r '.head_branch' <<<"$run")" >>"$GITHUB_OUTPUT"
          printf 'artifact_id=%s\n' "$artifact_id" >>"$GITHUB_OUTPUT"
          printf 'artifact_digest=%s\n' "$artifact_digest" >>"$GITHUB_OUTPUT"

      - name: Check out the exact trusted CI source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.trusted_ci.outputs.head_sha }}

      - name: Download the exact tested artifacts
        env:
          ARTIFACT_ID: ${{ steps.trusted_ci.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.trusted_ci.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/installer"
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" \
            --dir "$RUNNER_TEMP/release" \
            --pattern 'codex-usage-sidebar-v0.2.3.zip' \
            --pattern 'SHA256SUMS.txt'
          artifact_zip="$RUNNER_TEMP/installer-artifact.zip"
          gh api "repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" >"$artifact_zip"
          downloaded_digest="$(sha256sum "$artifact_zip" | awk '{print $1}')"
          test "sha256:$downloaded_digest" = "$ARTIFACT_DIGEST"
          unzip -q "$artifact_zip" -d "$RUNNER_TEMP/installer"

      - name: Verify and combine release checksums
        env:
          RUN_HEAD_SHA: ${{ steps.trusted_ci.outputs.head_sha }}
          RUN_REPOSITORY: ${{ steps.trusted_ci.outputs.run_repository }}
          RUN_URL: ${{ steps.trusted_ci.outputs.run_url }}
          RUN_WORKFLOW_PATH: ${{ steps.trusted_ci.outputs.workflow_path }}
          RUN_EVENT: ${{ steps.trusted_ci.outputs.event }}
          RUN_BRANCH: ${{ steps.trusted_ci.outputs.branch }}
          ARTIFACT_ID: ${{ steps.trusted_ci.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.trusted_ci.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          shasum -a 256 -c SHA256SUMS.txt
          test -f "$RUNNER_TEMP/installer/$INSTALLER_ASSET"
          test -f "$RUNNER_TEMP/installer/INSTALLER-SHA256SUMS.txt"
          test -f "$RUNNER_TEMP/installer/INSTALLER-PROVENANCE.json"
          cp "$RUNNER_TEMP/installer/$INSTALLER_ASSET" .
          cp "$RUNNER_TEMP/installer/INSTALLER-PROVENANCE.json" .
          shasum -a 256 -c "$RUNNER_TEMP/installer/INSTALLER-SHA256SUMS.txt"
          if grep -Fq "  $INSTALLER_ASSET" SHA256SUMS.txt; then
            echo "release checksum file already contains the installer asset" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/installer/INSTALLER-SHA256SUMS.txt" >> SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt
          test "$(jq -r '.version' INSTALLER-PROVENANCE.json)" = 0.2.3
          test "$(jq -r '.asset.name' INSTALLER-PROVENANCE.json)" = "$INSTALLER_ASSET"
          test "$(jq -r '.installerSourceCommit' INSTALLER-PROVENANCE.json)" = "$RUN_HEAD_SHA"
          INSTALLER_SDK="$(jq -r '.sdk.version' INSTALLER-PROVENANCE.json)"
          test "$INSTALLER_SDK" = 26.5
          "$GITHUB_WORKSPACE/scripts/finalize-installer-provenance.py" \
            --input INSTALLER-PROVENANCE.json \
            --output INSTALLER-PROVENANCE.json \
            --expected-repository "$REPOSITORY" \
            --run-repository "$RUN_REPOSITORY" \
            --run-id "$CI_RUN_ID" \
            --run-url "$RUN_URL" \
            --head-sha "$RUN_HEAD_SHA" \
            --workflow-path "$RUN_WORKFLOW_PATH" \
            --event "$RUN_EVENT" \
            --branch "$RUN_BRANCH" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$INSTALLER_ARTIFACT" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --release-tag "$RELEASE_TAG" \
            --sdk-version "$INSTALLER_SDK"
          test "$(jq -r '.ci.repository' INSTALLER-PROVENANCE.json)" = "$REPOSITORY"
          test "$(jq -r '.ci.runId' INSTALLER-PROVENANCE.json)" = "$CI_RUN_ID"
          test "$(jq -r '.artifact.id' INSTALLER-PROVENANCE.json)" = "$ARTIFACT_ID"
          test "$(jq -r '.artifact.digest' INSTALLER-PROVENANCE.json)" = "$ARTIFACT_DIGEST"
          test "$(jq -r '.release.tag' INSTALLER-PROVENANCE.json)" = "$RELEASE_TAG"

      - name: Upload installer files to the existing release
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          gh release upload "$RELEASE_TAG" \
            "$INSTALLER_ASSET" \
            SHA256SUMS.txt \
            INSTALLER-PROVENANCE.json \
            --repo "$REPOSITORY" \
            --clobber
