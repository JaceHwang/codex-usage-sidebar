name: v0.3.0 release candidates

on:
  push:
    branches: [v0.3.0]
    paths:
      - docs/validation/windows-v0.3.0.json
      - docs/validation/windows-v0.3.0-quick-prerelease.json

permissions:
  contents: read

jobs:
  release-profile:
    name: Select canonical evidence profile
    runs-on: ubuntu-24.04
    outputs:
      release-profile: ${{ steps.profile.outputs.release-profile }}
      evidence-path: ${{ steps.profile.outputs.evidence-path }}
      release-tag: ${{ steps.profile.outputs.release-tag }}
      validated-source: ${{ steps.profile.outputs.validated-source }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Select and verify the sole changed canonical evidence
        id: profile
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          from v030_release_profiles import profile

          before = os.environ["BEFORE_SHA"]
          head = os.environ["HEAD_SHA"]
          sha = re.compile(r"[0-9a-f]{40}")
          if sha.fullmatch(head) is None or sha.fullmatch(before) is None:
              raise SystemExit("workflow push SHAs must be lowercase full object IDs")
          if before == "0" * 40:
              command = [
                  "git", "diff-tree", "--root", "--no-commit-id", "--name-only",
                  "-r", "--no-renames", head,
              ]
          else:
              command = ["git", "diff", "--name-only", "--no-renames", before, head, "--"]
          changed = set(subprocess.run(
              command, check=True, text=True, stdout=subprocess.PIPE
          ).stdout.splitlines())
          canonical = {
              "docs/validation/windows-v0.3.0.json": "formal",
              "docs/validation/windows-v0.3.0-quick-prerelease.json": "quick-prerelease",
          }
          selected = set(canonical).intersection(changed)
          if len(selected) != 1:
              raise SystemExit("push must change exactly one canonical v0.3.0 evidence file")
          evidence_path = selected.pop()
          release_profile = canonical[evidence_path]
          descriptor = profile(release_profile)
          evidence = json.loads(Path(evidence_path).read_text(encoding="utf-8"))
          validated_source = evidence.get("sourceCommit")
          if not isinstance(validated_source, str) or sha.fullmatch(validated_source) is None:
              raise SystemExit("selected evidence has an invalid source commit")
          verifier = (
              "scripts/verify-windows-v030-validation.py"
              if release_profile == "formal"
              else "scripts/verify-windows-v030-quick-prerelease.py"
          )
          subprocess.run(
              ["python3", verifier, evidence_path, "--source-commit", validated_source],
              check=True,
          )
          subprocess.run(
              [
                  "python3", "scripts/verify-v030-packaging-delta.py",
                  "--repository", ".",
                  "--validated-source-commit", validated_source,
                  "--packaging-commit", head,
                  "--allowed-path", evidence_path,
              ],
              check=True,
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release-profile={descriptor['releaseProfile']}\n")
              output.write(f"evidence-path={descriptor['evidencePath']}\n")
              output.write(f"release-tag={descriptor['tag']}\n")
              output.write(f"validated-source={validated_source}\n")
          PY

  windows-x64:
    name: Windows 11 x64 setup candidate
    runs-on: windows-2025
    needs: release-profile
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Test Windows implementation and setup gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test plugins/codex-usage-sidebar/windows/CodexUsageSidebar.Windows.sln --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format plugins/codex-usage-sidebar/windows/CodexUsageSidebar.Windows.sln --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tests/test-windows-device-payload.ps1
          & tests/test-windows-v030-setup.ps1
          & tests/test-windows-embedded-setup-integration.ps1

      - name: Verify selected Windows evidence
        shell: pwsh
        run: |
          $profile = '${{ needs.release-profile.outputs.release-profile }}'
          $evidencePath = '${{ needs.release-profile.outputs.evidence-path }}'
          $validatedSource = '${{ needs.release-profile.outputs.validated-source }}'
          $verifier = if ($profile -eq 'formal') {
            'scripts/verify-windows-v030-validation.py'
          } else {
            'scripts/verify-windows-v030-quick-prerelease.py'
          }
          python $verifier $evidencePath --source-commit $validatedSource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build evidence-bound setup outside the repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = '${{ needs.release-profile.outputs.release-profile }}'
          $evidencePath = '${{ needs.release-profile.outputs.evidence-path }}'
          $validatedSource = '${{ needs.release-profile.outputs.validated-source }}'
          $output = Join-Path $env:RUNNER_TEMP 'codex-usage-sidebar-v030-windows'
          & scripts/build-windows-v030-setup.ps1 `
            -ReleaseProfile $profile `
            -ValidationEvidence $evidencePath `
            -OutputDirectory $output
          & scripts/verify-windows-v030-setup.ps1 `
            -ReleaseProfile $profile `
            -CandidateDirectory $output `
            -SourceCommit $validatedSource `
            -PackagingCommit '${{ github.sha }}'

      - name: Upload Windows x64 candidate
        id: upload_windows
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codex-usage-sidebar-v0.3.0-windows-x64-candidate
          path: |
            ${{ runner.temp }}/codex-usage-sidebar-v030-windows/codex-usage-sidebar-v0.3.0-windows-x64-setup.exe
            ${{ runner.temp }}/codex-usage-sidebar-v030-windows/WINDOWS-V030-PROVENANCE.json
            ${{ runner.temp }}/codex-usage-sidebar-v030-windows/WINDOWS-V030-SHA256SUMS.txt
          if-no-files-found: error

      - name: Finalize Windows candidate provenance
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ steps.upload_windows.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_windows.outputs.artifact-digest }}
        run: |
          $profile = '${{ needs.release-profile.outputs.release-profile }}'
          $validatedSource = '${{ needs.release-profile.outputs.validated-source }}'
          $digest = $env:ARTIFACT_DIGEST
          if ($digest -notmatch '^sha256:') { $digest = "sha256:$digest" }
          $candidate = Join-Path $env:RUNNER_TEMP 'codex-usage-sidebar-v030-windows'
          python scripts/finalize-windows-v030-provenance.py `
            --release-profile $profile `
            --input (Join-Path $candidate 'WINDOWS-V030-PROVENANCE.json') `
            --output (Join-Path $candidate 'WINDOWS-V030-PROVENANCE.final.json') `
            --expected-repository '${{ github.repository }}' `
            --run-repository '${{ github.repository }}' `
            --run-id '${{ github.run_id }}' `
            --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' `
            --head-sha '${{ github.sha }}' `
            --validated-source-sha $validatedSource `
            --workflow-path .github/workflows/v030-release-candidates.yml `
            --event push `
            --branch v0.3.0 `
            --artifact-id $env:ARTIFACT_ID `
            --artifact-name codex-usage-sidebar-v0.3.0-windows-x64-candidate `
            --artifact-digest $digest `
            --release-tag '${{ needs.release-profile.outputs.release-tag }}'

      - name: Upload finalized Windows provenance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codex-usage-sidebar-v0.3.0-windows-x64-provenance
          path: ${{ runner.temp }}/codex-usage-sidebar-v030-windows/WINDOWS-V030-PROVENANCE.final.json
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64 DMG candidate
    runs-on: macos-26
    needs: release-profile
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      CUS_V030_RELEASE_PROFILE: ${{ needs.release-profile.outputs.release-profile }}
      CUS_V030_EVIDENCE_PATH: ${{ needs.release-profile.outputs.evidence-path }}
      CUS_V030_SOURCE_COMMIT: ${{ needs.release-profile.outputs.validated-source }}
      CUS_V030_RELEASE_TAG: ${{ needs.release-profile.outputs.release-tag }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify pinned arm64 toolchain
        run: |
          test "$(uname -m)" = arm64
          test "$(xcrun --sdk macosx --show-sdk-version)" = 26.5
          xcodebuild -version

      - name: Bind candidate to validated source
        run: |
          case "$CUS_V030_RELEASE_PROFILE" in
            formal) verifier=scripts/verify-windows-v030-validation.py ;;
            quick-prerelease) verifier=scripts/verify-windows-v030-quick-prerelease.py ;;
            *) printf 'unsupported release profile\n' >&2; exit 65 ;;
          esac
          python3 "$verifier" "$CUS_V030_EVIDENCE_PATH" \
            --source-commit "$CUS_V030_SOURCE_COMMIT"

      - name: Test native implementation and release boundaries
        run: |
          xcrun swift test \
            --package-path plugins/codex-usage-sidebar/native \
            --configuration release \
            --arch arm64
          bash tests/test-macos-v030-release-pipeline.sh
          bash tests/test-v023-publish-freeze.sh

      - name: Build and verify macOS arm64 candidate
        run: |
          bash scripts/build-macos-v030-installer.sh
          bash scripts/package-macos-v030-installer.sh
          bash scripts/verify-macos-v030-installer-package.sh \
            '.dist/v0.3.0/macos/Codex Usage Sidebar Installer.app' \
            .dist/v0.3.0/macos/codex-usage-sidebar-v0.3.0-macos-arm64.dmg
          (cd .dist/v0.3.0/macos && shasum -a 256 -c MACOS-V030-SHA256SUMS.txt)

      - name: Upload macOS arm64 candidate
        id: upload_macos
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codex-usage-sidebar-v0.3.0-macos-arm64-candidate
          path: |
            .dist/v0.3.0/macos/codex-usage-sidebar-v0.3.0-macos-arm64.dmg
            .dist/v0.3.0/macos/MACOS-V030-PROVENANCE.json
            .dist/v0.3.0/macos/MACOS-V030-SHA256SUMS.txt
          if-no-files-found: error

      - name: Finalize macOS candidate provenance
        env:
          ARTIFACT_ID: ${{ steps.upload_macos.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_macos.outputs.artifact-digest }}
        run: |
          digest="$ARTIFACT_DIGEST"
          [[ "$digest" == sha256:* ]] || digest="sha256:$digest"
          python3 scripts/finalize-macos-v030-provenance.py \
            --release-profile "$CUS_V030_RELEASE_PROFILE" \
            --input .dist/v0.3.0/macos/MACOS-V030-PROVENANCE.json \
            --output .dist/v0.3.0/macos/MACOS-V030-PROVENANCE.final.json \
            --expected-repository '${{ github.repository }}' \
            --run-repository '${{ github.repository }}' \
            --run-id '${{ github.run_id }}' \
            --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            --head-sha '${{ github.sha }}' \
            --validated-source-sha "$CUS_V030_SOURCE_COMMIT" \
            --workflow-path .github/workflows/v030-release-candidates.yml \
            --event push \
            --branch v0.3.0 \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name codex-usage-sidebar-v0.3.0-macos-arm64-candidate \
            --artifact-digest "$digest" \
            --release-tag "$CUS_V030_RELEASE_TAG" \
            --sdk-version "$(xcrun --sdk macosx --show-sdk-version)"

      - name: Upload finalized macOS provenance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codex-usage-sidebar-v0.3.0-macos-arm64-provenance
          path: .dist/v0.3.0/macos/MACOS-V030-PROVENANCE.final.json
          if-no-files-found: error

  release-bundle:
    name: Verify and aggregate release candidates
    runs-on: ubuntu-24.04
    needs: [release-profile, windows-x64, macos-arm64]
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Download Windows x64 candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: codex-usage-sidebar-v0.3.0-windows-x64-candidate
          path: ${{ runner.temp }}/v030-downloads/windows-candidate

      - name: Download finalized Windows provenance
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: codex-usage-sidebar-v0.3.0-windows-x64-provenance
          path: ${{ runner.temp }}/v030-downloads/windows-provenance

      - name: Download macOS arm64 candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: codex-usage-sidebar-v0.3.0-macos-arm64-candidate
          path: ${{ runner.temp }}/v030-downloads/macos-candidate

      - name: Download finalized macOS provenance
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: codex-usage-sidebar-v0.3.0-macos-arm64-provenance
          path: ${{ runner.temp }}/v030-downloads/macos-provenance

      - name: Stage and verify exact release bundle
        shell: bash
        run: |
          set -euo pipefail
          downloads="$RUNNER_TEMP/v030-downloads"
          release_bundle="$RUNNER_TEMP/release-bundle"

          require_exact_files() {
            local directory="$1"
            shift
            local actual actual_count expected entry
            test -d "$directory"
            test ! -L "$directory"
            actual="$(find "$directory" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
            actual_count="$(find "$directory" -mindepth 1 -maxdepth 1 -printf 'x' | wc -c)"
            expected="$(printf '%s\n' "$@" | LC_ALL=C sort)"
            test "$actual" = "$expected"
            test "$actual_count" -eq "$#"
            for entry in "$@"; do
              test -f "$directory/$entry"
              test ! -L "$directory/$entry"
            done
          }

          require_exact_files "$downloads/windows-candidate" \
            codex-usage-sidebar-v0.3.0-windows-x64-setup.exe \
            WINDOWS-V030-PROVENANCE.json \
            WINDOWS-V030-SHA256SUMS.txt
          require_exact_files "$downloads/windows-provenance" \
            WINDOWS-V030-PROVENANCE.final.json
          require_exact_files "$downloads/macos-candidate" \
            codex-usage-sidebar-v0.3.0-macos-arm64.dmg \
            MACOS-V030-PROVENANCE.json \
            MACOS-V030-SHA256SUMS.txt
          require_exact_files "$downloads/macos-provenance" \
            MACOS-V030-PROVENANCE.final.json

          mkdir "$release_bundle"
          install -m 0644 "$downloads/windows-candidate/codex-usage-sidebar-v0.3.0-windows-x64-setup.exe" "$release_bundle/"
          install -m 0644 "$downloads/windows-candidate/WINDOWS-V030-SHA256SUMS.txt" "$release_bundle/"
          install -m 0644 "$downloads/windows-provenance/WINDOWS-V030-PROVENANCE.final.json" "$release_bundle/"
          install -m 0644 "$downloads/macos-candidate/codex-usage-sidebar-v0.3.0-macos-arm64.dmg" "$release_bundle/"
          install -m 0644 "$downloads/macos-candidate/MACOS-V030-SHA256SUMS.txt" "$release_bundle/"
          install -m 0644 "$downloads/macos-provenance/MACOS-V030-PROVENANCE.final.json" "$release_bundle/"

          validated_source='${{ needs.release-profile.outputs.validated-source }}'
          python3 scripts/verify-v030-candidate-set.py "$release_bundle" \
            --validated-source "$validated_source" \
            --packaging-commit '${{ github.sha }}' \
            --release-profile '${{ needs.release-profile.outputs.release-profile }}' \
            --output "$RUNNER_TEMP/V030-RELEASE-SUMMARY.json"
          python3 -m json.tool "$RUNNER_TEMP/V030-RELEASE-SUMMARY.json"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codex-usage-sidebar-v0.3.0-release-bundle
          path: |
            ${{ runner.temp }}/release-bundle/codex-usage-sidebar-v0.3.0-windows-x64-setup.exe
            ${{ runner.temp }}/release-bundle/WINDOWS-V030-SHA256SUMS.txt
            ${{ runner.temp }}/release-bundle/WINDOWS-V030-PROVENANCE.final.json
            ${{ runner.temp }}/release-bundle/codex-usage-sidebar-v0.3.0-macos-arm64.dmg
            ${{ runner.temp }}/release-bundle/MACOS-V030-SHA256SUMS.txt
            ${{ runner.temp }}/release-bundle/MACOS-V030-PROVENANCE.final.json
          if-no-files-found: error
